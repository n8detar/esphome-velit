# ════════════════════════════════════════════════════════════════════════════
#  MaxxAir Fan IR Controller — ESPHome External Component Example
#  GitHub: https://github.com/YOUR_USERNAME/esphome-maxxair-fan
#
#  Hardware
#  ────────
#  • ESP8266 (Wemos D1 Mini) or ESP32
#  • IR LED (940 nm) + 220 Ω series resistor
#    3.3 V ──[220Ω]──┤►├── GPIO (ir_led_pin)
#
#  IR Protocol credit
#  ──────────────────
#  Reverse-engineered by skypeachblue, wingspinner, and Jeff Brown
#  (https://github.com/brown-studios/esphome-maxxfan-protocol).
#  This component reimplements the same encoder to generate IR signals
#  programmatically — no hardcoded raw blobs.
#
#  Entities (all grouped as one sub-device in Home Assistant)
#  ──────────────────────────────────────────────────────────
#  fan     "Fan"               — 10-speed, forward=exhaust / reverse=intake
#  switch  "Ceiling Fan Mode"  — lid-closed downflow (air in, lid shut)
#  switch  "Auto Fan"          — flag for HA automation blueprints
#  cover   "Lid"               — open/close the MaxxAir lid
#  sensor  WiFi Signal dB      — diagnostic
#  sensor  WiFi Signal %       — diagnostic
# ════════════════════════════════════════════════════════════════════════════

substitutions:
  device_name:        "maxxair-fan-control"
  friendly_name:      "MaxxAir Fan Control"
  ir_led_pin:         "D6"       # GPIO connected to IR LED cathode
  onboard_led_pin:    "D4"       # Built-in LED (active-low on D1 Mini)

# ── External component ────────────────────────────────────────────────────────
external_components:
  - source:
      type: git
      url: https://github.com/YOUR_USERNAME/esphome-maxxair-fan
      ref: main
    components: [ maxxair_fan ]
    refresh: 1d

# ── Core ──────────────────────────────────────────────────────────────────────
esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"
  min_version: "2025.7.0"      # sub-devices require ESPHome ≥ 2025.7.0

  # Sub-device: all MaxxAir entities appear as one device in Home Assistant.
  # Add more entries here if you control multiple fans from one ESP.
  devices:
    - id: maxxair_device
      name: "MaxxAir Fan"

esp8266:
  board: d1_mini
  early_pin_init: false
  restore_from_flash: true

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  ap:
    ssid: "Maxxair-Fan-Fallback"
    password: !secret wifi_password

captive_portal:

status_led:
  pin:
    number: "${onboard_led_pin}"
    inverted: true

# ── IR transmitter ────────────────────────────────────────────────────────────
remote_transmitter:
  id: ir_tx
  pin: "${ir_led_pin}"
  carrier_duty_percent: 50%

# ── MaxxAir component ─────────────────────────────────────────────────────────
# The component encodes the MaxxAir IR protocol at runtime — no raw IR blobs.
# It exposes methods callable from lambda actions in scripts below:
#   id(maxxair).send_exhaust(speed_1_to_10)
#   id(maxxair).send_intake(speed_1_to_10)
#   id(maxxair).send_ceiling(speed_1_to_10)   ← lid closed, air downward
#   id(maxxair).send_lid_open()
#   id(maxxair).send_lid_close()
#   id(maxxair).send(fan_on, fan_exhaust, cover_open, speed_pct,
#                    auto_mode, auto_temperature, special, warn)
maxxair_fan:
  id: maxxair
  transmitter_id: ir_tx

# ── Global state ──────────────────────────────────────────────────────────────
globals:
  - id: fan_output_value
    type: float
    restore_value: no
    initial_value: "0.0"

# ── Fan entity ────────────────────────────────────────────────────────────────
fan:
  - platform: speed
    id: maxxair_fan_id
    name: "Fan"
    icon: "mdi:fan"
    speed_count: 10
    output: fan_speed_output
    direction_output: fan_direction_output
    restore_mode: RESTORE_DEFAULT_OFF
    device_id: maxxair_device

    on_turn_off:
      - switch.template.publish:
          id: ceiling_fan_mode
          state: OFF
      - switch.template.publish:
          id: auto_fan
          state: OFF
      - cover.template.publish:
          id: maxxair_lid
          state: CLOSED

    on_turn_on:
      - if:
          condition:
            - switch.is_off: ceiling_fan_mode
          then:
            - cover.template.publish:
                id: maxxair_lid
                state: OPEN

# ── Outputs (fan platform → IR) ───────────────────────────────────────────────
output:
  # Direction output: when fan direction changes, enforce ceiling-mode constraint
  - platform: template
    id: fan_direction_output
    type: float
    write_action:
      - lambda: |-
          if (id(maxxair_fan_id).direction == FanDirection::FORWARD) {
            id(ceiling_fan_mode).turn_off();
          }

  # Speed output: store current speed float and trigger IR transmission
  - platform: template
    id: fan_speed_output
    type: float
    write_action:
      - lambda: id(fan_output_value) = state;
      - if:
          condition:
            - lambda: return state > 0.0;
          then:
            - script.execute: send_ir_command

# ── IR transmission script ────────────────────────────────────────────────────
script:
  - id: send_ir_command
    then:
      - if:
          condition:
            - lambda: return id(fan_output_value) > 0.0;
          then:
            # ── Ceiling Fan Mode (lid closed, intake, special flag) ──────────
            - if:
                condition:
                  - switch.is_on: ceiling_fan_mode
                then:
                  - lambda: id(maxxair).send_ceiling(id(maxxair_fan_id).speed);
                  - logger.log: "IR → Ceiling Fan Mode"

            # ── Air IN / Intake (reverse, lid open) ─────────────────────────
            - if:
                condition:
                  and:
                    - lambda: >
                        return id(maxxair_fan_id).direction == FanDirection::REVERSE;
                    - switch.is_off: ceiling_fan_mode
                then:
                  - lambda: id(maxxair).send_intake(id(maxxair_fan_id).speed);
                  - logger.log: "IR → Air IN (intake)"

            # ── Air OUT / Exhaust (forward, lid open) ───────────────────────
            - if:
                condition:
                  and:
                    - lambda: >
                        return id(maxxair_fan_id).direction == FanDirection::FORWARD;
                    - switch.is_off: ceiling_fan_mode
                then:
                  - lambda: id(maxxair).send_exhaust(id(maxxair_fan_id).speed);
                  - logger.log: "IR → Air OUT (exhaust)"

# ── Switches ──────────────────────────────────────────────────────────────────
switch:
  # Auto Fan — no local logic; toggled by HA automation blueprints
  - platform: template
    id: auto_fan
    name: "Auto Fan"
    icon: "mdi:fan-auto"
    optimistic: true
    device_id: maxxair_device

  # Ceiling Fan Mode — lid closed, fan pushes air downward
  - platform: template
    id: ceiling_fan_mode
    name: "Ceiling Fan Mode"
    icon: "mdi:ceiling-fan"
    optimistic: true
    device_id: maxxair_device

    on_turn_on:
      then:
        # Force direction to REVERSE (ceiling mode is always intake)
        - lambda: |-
            auto call = id(maxxair_fan_id).make_call();
            call.set_direction(FanDirection::REVERSE);
            call.perform();
        # Turn fan on if currently off
        - if:
            condition:
              - fan.is_off: maxxair_fan_id
            then:
              - fan.turn_on: maxxair_fan_id
        - cover.template.publish:
            id: maxxair_lid
            state: CLOSED
        - script.execute: send_ir_command

    on_turn_off:
      then:
        - if:
            condition:
              - fan.is_on: maxxair_fan_id
            then:
              - cover.template.publish:
                  id: maxxair_lid
                  state: OPEN
              - script.execute: send_ir_command

# ── Lid cover ─────────────────────────────────────────────────────────────────
cover:
  - platform: template
    id: maxxair_lid
    name: "Lid"
    icon: "mdi:chart-ppf"
    assumed_state: true
    optimistic: true
    device_id: maxxair_device

    on_open:
      # Fan off → passive lid-open command (no fan spin)
      - if:
          condition:
            - fan.is_off: maxxair_fan_id
          then:
            - lambda: id(maxxair).send_lid_open();
      # Fan on + ceiling mode → disable ceiling mode (opens lid, fan continues)
      - if:
          condition:
            and:
              - fan.is_on: maxxair_fan_id
              - switch.is_on: ceiling_fan_mode
          then:
            - switch.template.publish:
                id: ceiling_fan_mode
                state: OFF

    on_closed:
      # Fan on + not ceiling mode → engage ceiling mode
      - if:
          condition:
            and:
              - fan.is_on: maxxair_fan_id
              - switch.is_off: ceiling_fan_mode
          then:
            - switch.template.publish:
                id: ceiling_fan_mode
                state: ON
      # Fan off → passive lid-close command
      - if:
          condition:
            - fan.is_off: maxxair_fan_id
          then:
            - lambda: id(maxxair).send_lid_close();

# ── Diagnostics ───────────────────────────────────────────────────────────────
sensor:
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic
    device_id: maxxair_device

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Strength"
    entity_category: diagnostic
    device_id: maxxair_device
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
